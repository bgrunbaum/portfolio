<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Meta</h1>

  <div class="slider-container">
    <label for="commit-progress">
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100" />
      <time id="commit-time"></time>
    </label>
  </div>

  <div id="stats"></div>

  <div id="scrolly-1">
    <div id="scatter-story">some filler text here</div>
    <div id="scatter-plot">
      <div id="chart"></div>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
      <dl id="files"></dl>
    </div>
  </div>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>
  </dl>


  <script type="module" src="main.js"></script>
  <script type="module" src="../global.js"></script>
</body>
</html>
